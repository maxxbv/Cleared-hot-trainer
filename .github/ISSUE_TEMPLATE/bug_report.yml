name: Bug report
description: Report a reproducible local or runtime failure
body:
  - type: markdown
    attributes:
      value: "Do not attach game DLLs, metadata, saves, full local paths, tokens or credentials. Redact logs."
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Plugin, Unity, BepInEx and Il2CppInterop versions
  - type: textarea
    id: logs
    attributes:
      label: Relevant redacted log excerpts
