name: Public build and checks (plugin requires local game references)
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      upload_public_artifacts:
        description: Upload only the public test executable and audit report
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: public-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-checks:
    name: Compile public code and run tests - not a full plugin build
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_HOME: ${{ github.workspace }}/work/dotnet-home
      NUGET_PACKAGES: ${{ github.workspace }}/work/nuget
      DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: '0'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      DOTNET_NOLOGO: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Audit repository sources
        run: ./scripts/audit.ps1
      - name: Restore public test project
        run: dotnet restore tests/ClearedHotTrainer.Tests/ClearedHotTrainer.Tests.csproj
      - name: Compile public tests and production policy in Release
        run: ./scripts/build.ps1 -PublicOnly -NoRestore
      - name: Run public automated tests
        run: ./scripts/test.ps1 -NoBuild
      - name: Test audit refusal behavior
        run: |
          ./tests/Test-Audit.ps1
          ./tests/Test-StagedAudit.ps1
      - name: Explain validation boundary
        run: |
          "## Public checks only" >> $env:GITHUB_STEP_SUMMARY
          "The public test executable and actual production policy were compiled and tested." >> $env:GITHUB_STEP_SUMMARY
          "The full plugin was NOT compiled: its game interop references stay local and are never uploaded." >> $env:GITHUB_STEP_SUMMARY
          "No gameplay validation, release, tag or game installation is performed." >> $env:GITHUB_STEP_SUMMARY
      - name: Upload permitted public outputs only
        if: github.event_name == 'workflow_dispatch' && inputs.upload_public_artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-tests-only
          path: |
            build/bin/ClearedHotTrainer.Tests/Release/net8.0/
            logs/git-audit.json
          if-no-files-found: error
          retention-days: 7
